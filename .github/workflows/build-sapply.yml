name: Build Sapply AI Image

on:
  workflow_dispatch:
  push:
    branches:
      - sapply-brand
    paths:
      - 'projects/app/**'
      - 'packages/**'
      - 'tsconfig.json'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sapply-brand
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fastgpt:sapply
            ghcr.io/${{ github.repository_owner }}/fastgpt:latest
